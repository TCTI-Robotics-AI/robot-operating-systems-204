name: Portable course checks
on:
  push:
    paths:
      - 'shared/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'labs/05-conversation-and-speech/ros/course_conversation/aiml/**'
      - '.github/workflows/portable-checks.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  commands-and-protocol:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[conversation,serial,gpio]'
      - run: python -m unittest discover -s tests -v
      - run: g++ -std=c++17 -I tests/firmware -I shared/firmware tests/firmware/protocol_test.cpp -o /tmp/course204-protocol-test
      - run: /tmp/course204-protocol-test
