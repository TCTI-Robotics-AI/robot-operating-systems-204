# Course-specific USB capture input; existing default devices are unchanged.
# مدخل تسجيل مستقل للمقرر. معرف بطاقة الصوت في الجهاز المختبر هو Audio.
# Use --device course204_mic --gain-db 0 with voice_lamp.py (avoid double gain).
pcm.course204_mic_gain {
    type softvol
    slave.pcm "plughw:CARD=Audio,DEV=0"
    control {
        name "Course204 Capture Gain"
        card "Audio"
        count 1
    }
    min_dB -20.0
    max_dB 36.0
    resolution 561
}
pcm.course204_mic {
    type hooks
    slave.pcm "course204_mic_gain"
    hooks.0 {
        type ctl_elems
        hook_args [
            {
                name "Course204 Capture Gain"
                value 480
                lock false
                preserve false
                optional false
            }
        ]
    }
    hint {
        show on
        description "Course204 USB microphone with +28 dB capture gain"
    }
}
