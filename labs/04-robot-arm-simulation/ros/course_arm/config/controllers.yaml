joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 50
shoulder_controller:
  type: effort_controllers/JointPositionController
  joint: shoulder_joint
  pid: {p: 40.0, i: 0.0, d: 1.0}
elbow_controller:
  type: effort_controllers/JointPositionController
  joint: elbow_joint
  pid: {p: 25.0, i: 0.0, d: 0.3}
wrist_controller:
  type: effort_controllers/JointPositionController
  joint: wrist_joint
  pid: {p: 2.0, i: 0.0, d: 0.01}
gripper_controller:
  type: effort_controllers/JointPositionController
  joint: gripper_joint
  pid: {p: 40.0, i: 0.0, d: 0.2}
